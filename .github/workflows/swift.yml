name: Swift CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Swift Tests
    runs-on: macos-14 # Uses Apple Silicon runner (M1/M2) with Xcode preinstalled

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build TinyCloud Package/App
        run: |
          swift build -v

      - name: Run Unit & Integration Tests
        run: |
          swift test -v
